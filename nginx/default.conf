upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

# 1. Редирект с HTTP (80) на HTTPS (443)
server {
    listen 80;
    server_name lms-amg.duckdns.org localhost _;
    return 301 https://lms-amg.duckdns.org$request_uri;
}

# 2. Основной сервер HTTPS (443)
server {
    listen 443 ssl;
    server_name lms-amg.duckdns.org;

    # Пути к сертификатам Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/lms-amg.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms-amg.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Maximum file upload size: 0 means unlimited
    client_max_body_size 0;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Unbuffered upload endpoint
    location ~ ^/api/(v1/)?media/upload/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        client_max_body_size 0;
    }

    # Direct media static streaming
    location /media/ {
        alias /app/media/;
        add_header Accept-Ranges bytes;
        expires 30d;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
    }

    # Backend API routes
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Swagger / OpenAPI documentation
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Single Page Application
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}