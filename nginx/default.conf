# Map for clean WebSocket upgrade headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. HTTP (80) -> HTTPS (443) redirect preserving requested host
server {
    listen 80;
    server_name amg-training.xyz www.amg-training.xyz lms-amg.duckdns.org localhost _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server (443)
server {
    listen 443 ssl;
    server_name amg-training.xyz www.amg-training.xyz lms-amg.duckdns.org;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/amg-training.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amg-training.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker internal DNS resolver with 5s TTL and IPv6 disabled
    # Automatically re-resolves container IPs whenever backend or frontend restarts or rebuilds
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Maximum file upload size: 0 means unlimited
    client_max_body_size 0;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Unbuffered upload endpoint
    location ~ ^/api/(v1/)?media/upload/ {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        client_max_body_size 0;
    }

    # Direct media static streaming
    location /media/ {
        alias /app/media/;
        add_header Accept-Ranges bytes;
        expires 30d;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
    }

    # Backend API & WebSocket routes
    location /api/ {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Swagger / OpenAPI documentation
    location ~ ^/(docs|redoc|openapi.json) {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Single Page Application
    location / {
        set $frontend_target "http://frontend:80";
        proxy_pass $frontend_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
